<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다이어그램 서랍</title>
<style>
  :root { --bg: #ffffff; --panel: #f6f7f9; --line: #e2e5ea; --text: #1d2228; --dim: #6b7280; --accent: #6a45a8; --accent-soft: #f4effc; --gold: #d99a06; --red: #a63830; --mark: #fff1a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(255, 255, 255, .96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; max-width: 1500px; margin: 0 auto; }
  .bar h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .bar h1 small { color: var(--dim); font-weight: 400; margin-left: 6px; font-size: 13px; }
  #q { flex: 1; min-width: 120px; max-width: 520px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  #q:focus { outline: none; border-color: var(--accent); background: #fff; }
  select, button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; color: var(--text); }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  #tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 10px; max-width: 1500px; margin: 0 auto; }
  #tags:empty { display: none; }
  .tag { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--dim); cursor: pointer; white-space: nowrap; }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  .tag.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tag b { font-weight: 400; opacity: .7; margin-left: 3px; }
  main { max-width: 1500px; margin: 0 auto; padding: 14px 20px 60px; }
  h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 18px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: inherit; text-decoration: none; overflow: hidden; transition: box-shadow .15s, border-color .15s; }
  .card:hover { border-color: #cfc3e6; box-shadow: 0 4px 16px rgba(30, 20, 60, .08); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { height: 170px; background: #fbfbfc; border-bottom: 1px solid var(--line); padding: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .thumb svg { width: 100% !important; height: 100% !important; max-width: none !important; }
  .thumb .wait, .thumb .fail { font-size: 12px; color: var(--dim); }
  .thumb .fail { color: var(--red); text-align: center; padding: 0 10px; }
  .tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .card:hover .tools, .card:focus-within .tools { opacity: 1; }
  .tools button { padding: 2px 7px; font-size: 13px; background: rgba(255, 255, 255, .95); }
  .tools button.pinned { color: var(--gold); border-color: #f0d68a; }
  .body { padding: 9px 12px 11px; display: flex; flex-direction: column; gap: 3px; min-height: 0; }
  .title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title .star { color: var(--gold); margin-right: 3px; }
  .meta { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); }
  .badge.map { background: var(--accent-soft); border-color: #dccff2; color: var(--accent); }
  .ctags { display: flex; gap: 4px; flex-wrap: wrap; }
  .ctags span { font-size: 11px; color: var(--accent); }
  .memo { font-size: 12px; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .memo mark, .snippet mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .snippet { font-size: 12px; color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .empty b { color: var(--text); }
  .trash-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .trash-row .t { flex: 1; min-width: 0; }
  .trash-row .t div:first-child { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; width: min(440px, 92vw); box-shadow: 0 12px 40px rgba(0, 0, 0, .18); }
  dialog::backdrop { background: rgba(20, 20, 30, .25); }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  dialog input[type=text] { width: 100%; font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; }
  dialog input[type=text]:focus { outline: none; border-color: var(--accent); }
  .types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .types button { padding: 7px 0; }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #error { color: var(--red); white-space: pre-wrap; font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: #1d2228; color: #fff; padding: 7px 8px 7px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .95; pointer-events: auto; }
  #toast button { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .35); padding: 2px 9px; }
  #toast button:empty { display: none; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>다이어그램 서랍<small id="count"></small></h1>
    <input id="q" type="search" placeholder="제목, 태그, 메모, 그림 안의 이름으로 찾기" autocomplete="off">
    <select id="sort" title="정렬">
      <option value="updated">최근 수정순</option>
      <option value="created">만든 순</option>
      <option value="title">이름순</option>
    </select>
    <span class="spacer"></span>
    <button id="trash-toggle" title="휴지통">휴지통</button>
    <button id="new" class="primary" title="n">+ 새 다이어그램</button>
  </div>
  <div id="tags"></div>
</header>
<main>
  <div id="error"></div>
  <div id="content"></div>
</main>
<dialog id="new-dialog">
  <form method="dialog" id="new-form">
    <h3>새 다이어그램</h3>
    <label for="new-title">제목</label>
    <input type="text" id="new-title" placeholder="예: 노트 작성 흐름" maxlength="200">
    <label>종류</label>
    <div class="types" id="new-types">
      <button type="button" data-type="sequence">시퀀스</button>
      <button type="button" data-type="flowchart">플로차트</button>
      <button type="button" data-type="class">클래스</button>
      <button type="button" data-type="state">상태</button>
    </div>
    <div class="row">
      <button type="button" id="new-cancel">취소</button>
      <button type="submit" class="primary">만들고 편집하기</button>
    </div>
  </form>
</dialog>
<div id="toast"><span id="toast-text"></span><button id="toast-action"></button></div>
<script src="/mermaid.js"></script>
<script>
const TOKEN = '__TOKEN__'
const VERSION = '__VERSION__'
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', suppressErrorRendering: true })

const TYPE_NAMES = {
  map: '설계 지도', 'map-sequence': '시퀀스 설계 지도', sequenceDiagram: '시퀀스', flowchart: '플로차트', graph: '플로차트', classDiagram: '클래스',
  stateDiagram: '상태', 'stateDiagram-v2': '상태', erDiagram: 'ER', gantt: '간트', mindmap: '마인드맵',
  timeline: '타임라인', pie: '파이', journey: '여정', gitGraph: 'git', C4Context: 'C4', C4Container: 'C4', C4Component: 'C4',
}
const typeName = t => TYPE_NAMES[t] || t || '다이어그램'

let items = []
let trashCount = 0
let state = { q: '', tag: '', sort: 'updated', isTrash: false }
try { state.sort = localStorage.getItem('design-map-drawer-sort') || 'updated' } catch {}
$('sort').value = state.sort

async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-design-map-token': TOKEN }, body: JSON.stringify(body || {}) })
  const text = await res.text()
  let value = {}
  try { value = JSON.parse(text) } catch { value = { error: text } }
  if (!res.ok) throw new Error(value.error || text)
  return value
}

// ---------------------------------------------------------------- time and text
function ago(t) {
  if (!t) return ''
  const s = (Date.now() - t) / 1000
  if (s < 60) return '방금'
  if (s < 3600) return Math.floor(s / 60) + '분 전'
  const d = new Date(t)
  const now = new Date()
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime()
  const days = Math.round((day(now) - day(d)) / 86400000)
  if (days === 0) return Math.floor(s / 3600) + '시간 전'
  if (days === 1) return '어제'
  if (days < 7) return days + '일 전'
  return (d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '년 ') + (d.getMonth() + 1) + '월 ' + d.getDate() + '일'
}
/** The first line of a memo with its markdown marks taken off. */
function firstLine(memo) {
  const line = String(memo || '').split('\n').map(l => l.trim()).find(l => l !== '' && !l.startsWith('```')) || ''
  return line.replace(/^#+\s*|^[-*]\s+/, '').replace(/\*\*|`/g, '')
}
/** Escaped text with every term marked: matched on the raw text, each piece escaped on its own. */
function marked(text, terms) {
  const raw = String(text ?? '')
  const active = terms.filter(Boolean)
  if (active.length === 0) return esc(raw)
  const pattern = new RegExp(active.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi')
  let html = ''
  let last = 0
  for (const m of raw.matchAll(pattern)) {
    html += esc(raw.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>'
    last = m.index + m[0].length
  }
  return html + esc(raw.slice(last))
}
/** Where in the diagram's own text a term was found, when the title, tags and memo did not have it. */
function snippet(item, terms) {
  const shown = (item.title + '\n' + item.tags.join(' ') + '\n' + item.memo).toLowerCase()
  const term = terms.find(t => !shown.includes(t))
  if (!term) return ''
  const at = item.text.toLowerCase().indexOf(term)
  if (at < 0) return ''
  const from = Math.max(0, at - 24)
  const piece = item.text.slice(from, at + term.length + 40).replace(/\s+/g, ' ')
  return (from > 0 ? '…' : '') + marked(piece, [term]) + '…'
}

// ---------------------------------------------------------------- thumbnails
// Mermaid draws one diagram at a time; cards ask for theirs as they come into view.
const drawn = new Map()
let queue = Promise.resolve()
let drawCount = 0
function hash(text) {
  let h = 0x811c9dc5
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0 }
  return h.toString(16)
}
function draw(item) {
  const key = item.id + '|' + hash(item.mermaid)
  if (!drawn.has(key)) {
    drawn.set(key, queue = queue.then(async () => {
      const id = 'th' + (++drawCount)
      try {
        const { svg } = await mermaid.render(id, item.mermaid)
        return { svg }
      } catch (error) {
        document.getElementById('d' + id)?.remove()
        document.getElementById(id)?.remove()
        return { error: String(error && error.message || error).split('\n')[0] }
      }
    }))
  }
  return drawn.get(key)
}
const observer = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue
    observer.unobserve(entry.target)
    const item = items.find(i => i.id === entry.target.dataset.id)
    if (item) fillThumb(entry.target, item)
  }
}, { rootMargin: '300px' })
async function fillThumb(el, item) {
  if (item.error) { el.innerHTML = '<div class="fail">읽지 못했어<br>' + esc(item.error) + '</div>'; return }
  if (!item.mermaid.trim()) { el.innerHTML = '<div class="wait">비어 있어</div>'; return }
  const result = await draw(item)
  if (!el.isConnected) return
  if (result.error) { el.innerHTML = '<div class="fail" title="' + esc(result.error) + '">그리기 실패<br>' + esc(result.error.slice(0, 90)) + '</div>'; return }
  el.innerHTML = result.svg
  const svg = el.querySelector('svg')
  if (svg) { svg.removeAttribute('style'); svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%') }
}

// ---------------------------------------------------------------- the list
function matches(item, terms) {
  const hay = (item.title + '\n' + item.tags.join(' ') + '\n' + item.memo + '\n' + item.text + '\n' + item.id).toLowerCase()
  return terms.every(t => hay.includes(t))
}
const SORTS = {
  updated: (a, b) => b.updatedAt - a.updatedAt,
  created: (a, b) => b.createdAt - a.createdAt,
  title: (a, b) => a.title.localeCompare(b.title, 'ko'),
}
function card(item, terms) {
  const a = document.createElement('a')
  a.className = 'card'
  a.href = '/map/' + encodeURIComponent(item.id)
  const found = terms.length ? snippet(item, terms) : ''
  const memo = firstLine(item.memo)
  a.innerHTML =
    '<div class="thumb" data-id="' + esc(item.id) + '"><div class="wait">그리는 중…</div></div>' +
    '<div class="tools">' +
      '<button data-act="pin" class="' + (item.pinned ? 'pinned' : '') + '" title="' + (item.pinned ? '고정 풀기' : '맨 위에 고정') + '">' + (item.pinned ? '★' : '☆') + '</button>' +
      '<button data-act="duplicate" title="복제">⧉</button>' +
      '<button data-act="trash" title="휴지통으로">🗑</button>' +
    '</div>' +
    '<div class="body">' +
      '<div class="title" title="' + esc(item.title) + '">' + (item.pinned ? '<span class="star">★</span>' : '') + marked(item.title, terms) + '</div>' +
      '<div class="meta"><span class="badge' + (item.kind === 'map' ? ' map' : '') + '">' + esc(typeName(item.type)) + '</span><span>' + esc(ago(item.updatedAt)) + '</span><span>rev ' + esc(item.revision) + '</span></div>' +
      (item.tags.length ? '<div class="ctags">' + item.tags.map(t => '<span>#' + marked(t, terms) + '</span>').join('') + '</div>' : '') +
      (found ? '<div class="snippet">' + found + '</div>' : memo ? '<div class="memo">' + marked(memo, terms) + '</div>' : '') +
    '</div>'
  a.querySelectorAll('.tools button').forEach(b => {
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); act(item, b.dataset.act) }
  })
  observer.observe(a.querySelector('.thumb'))
  return a
}
function renderTags() {
  const counts = new Map()
  for (const item of items) for (const t of item.tags) counts.set(t, (counts.get(t) || 0) + 1)
  if (state.tag && !counts.has(state.tag)) state.tag = ''
  const tags = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ko'))
  $('tags').innerHTML = state.isTrash || tags.length === 0 ? '' :
    '<span class="tag' + (state.tag ? '' : ' on') + '" data-tag="">전체</span>' +
    tags.map(([t, n]) => '<span class="tag' + (state.tag === t ? ' on' : '') + '" data-tag="' + esc(t) + '">#' + esc(t) + '<b>' + n + '</b></span>').join('')
  $('tags').querySelectorAll('.tag').forEach(el => { el.onclick = () => { state.tag = state.tag === el.dataset.tag ? '' : el.dataset.tag; render() } })
}
function render() {
  $('trash-toggle').textContent = state.isTrash ? '← 서랍으로' : '휴지통' + (trashCount ? ' ' + trashCount : '')
  $('trash-toggle').classList.toggle('on', state.isTrash)
  $('count').textContent = state.isTrash ? '휴지통' : items.length + '개'
  observer.disconnect()
  renderTags()
  if (state.isTrash) return renderTrash()
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean)
  const shown = items.filter(i => (!state.tag || i.tags.includes(state.tag)) && matches(i, terms)).sort(SORTS[state.sort] || SORTS.updated)
  const content = $('content')
  content.innerHTML = ''
  if (items.length === 0) {
    content.innerHTML = '<div class="empty"><b>서랍이 비어 있어.</b><br>Claude에게 "이거 서랍에 넣어 줘"라고 하거나, <b>+ 새 다이어그램</b>으로 직접 만들어 봐.</div>'
    return
  }
  if (shown.length === 0) {
    content.innerHTML = '<div class="empty">찾는 다이어그램이 없어.</div>'
    return
  }
  const pinned = shown.filter(i => i.pinned)
  const rest = shown.filter(i => !i.pinned)
  const section = (title, list) => {
    if (list.length === 0) return
    const h = document.createElement('h2')
    h.textContent = title
    const grid = document.createElement('div')
    grid.className = 'grid'
    for (const item of list) grid.appendChild(card(item, terms))
    content.append(h, grid)
  }
  const isFiltered = terms.length > 0 || state.tag
  section('고정 ' + pinned.length, pinned)
  section((isFiltered ? '찾은 다이어그램 ' : pinned.length ? '나머지 ' : '전체 ') + rest.length, rest)
}

// ---------------------------------------------------------------- the trash
async function renderTrash() {
  const content = $('content')
  const res = await fetch('/api/_library/trash', { cache: 'no-store' })
  const list = res.ok ? (await res.json()).items : []
  if (!state.isTrash) return
  content.innerHTML = list.length === 0 ? '<div class="empty">휴지통이 비어 있어.</div>' :
    '<h2>지운 다이어그램 ' + list.length + ' · 되살리면 지울 때 모습 그대로 돌아와</h2>' + list.map(t =>
      '<div class="trash-row"><div class="t"><div>' + esc(t.title) + '</div><div class="meta"><span class="badge' + (t.kind === 'map' ? ' map' : '') + '">' + esc(t.kind === 'map' ? '설계 지도' : '다이어그램') + '</span><span>' + esc(ago(t.trashedAt)) + ' 지움</span><code>' + esc(t.id) + '</code></div></div>' +
      '<button data-entry="' + esc(t.entry) + '">되살리기</button></div>').join('')
  content.querySelectorAll('button[data-entry]').forEach(b => {
    b.onclick = async () => {
      try {
        const { id } = await post('/api/_library/untrash', { entry: b.dataset.entry })
        toast('되살렸어', '열기', () => { location.href = '/map/' + encodeURIComponent(id) })
        await load()
      } catch (error) { $('error').textContent = '되살리기 실패: ' + error.message }
    }
  })
}

// ---------------------------------------------------------------- actions
async function act(item, what) {
  try {
    if (what === 'pin') {
      await post('/api/' + item.id + '/meta', { pinned: !item.pinned })
      toast(item.pinned ? '고정을 풀었어' : '맨 위에 고정했어')
    }
    if (what === 'duplicate') {
      const { id } = await post('/api/' + item.id + '/duplicate')
      toast('복제했어', '열기', () => { location.href = '/map/' + encodeURIComponent(id) })
    }
    if (what === 'trash') {
      const { entry } = await post('/api/' + item.id + '/trash')
      toast('"' + item.title + '"을(를) 휴지통으로 옮겼어', '되돌리기', () => untrash(entry))
    }
    await load()
  } catch (error) {
    $('error').textContent = '실패: ' + error.message
  }
}
async function untrash(entry) {
  try {
    await post('/api/_library/untrash', { entry })
    toast('되돌렸어')
    await load()
  } catch (error) { $('error').textContent = '되돌리기 실패: ' + error.message }
}
let toastTimer = null
function toast(text, label, onClick) {
  $('toast-text').textContent = text
  const action = $('toast-action')
  action.textContent = label || ''
  action.onclick = () => { $('toast').classList.remove('show'); if (onClick) onClick() }
  $('toast').classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), label ? 6000 : 2200)
}

// ---------------------------------------------------------------- a new diagram
let newType = 'sequence'
function pickType(type) {
  newType = type
  $('new-types').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.type === type))
}
$('new-types').querySelectorAll('button').forEach(b => { b.onclick = () => pickType(b.dataset.type) })
function openNew() {
  $('new-title').value = ''
  pickType(newType)
  $('new-dialog').showModal()
  $('new-title').focus()
}
$('new').onclick = openNew
$('new-cancel').onclick = () => $('new-dialog').close()
$('new-form').addEventListener('submit', async e => {
  e.preventDefault()
  try {
    const { id } = await post('/api/_library/new', { title: $('new-title').value.trim(), type: newType, tags: state.tag ? [state.tag] : [] })
    location.href = '/map/' + encodeURIComponent(id) + '?edit=1'
  } catch (error) {
    $('error').textContent = '만들기 실패: ' + error.message
    $('new-dialog').close()
  }
})

// ---------------------------------------------------------------- input
let qTimer = null
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $('q').value.trim(); render() }, 120) })
$('q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('q').value = ''; state.q = ''; render(); $('q').blur() } })
$('sort').onchange = () => {
  state.sort = $('sort').value
  try { localStorage.setItem('design-map-drawer-sort', state.sort) } catch {}
  render()
}
$('trash-toggle').onclick = () => { state.isTrash = !state.isTrash; render() }
addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || $('new-dialog').open
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === '/') { e.preventDefault(); $('q').focus() }
  if (e.key === 'n') { e.preventDefault(); openNew() }
})

// ---------------------------------------------------------------- data
async function load() {
  const res = await fetch('/api/_library', { cache: 'no-store' })
  if (!res.ok) { $('error').textContent = '목록을 못 읽었어: ' + await res.text(); return }
  const next = await res.json()
  items = next.items
  trashCount = next.trashCount
  $('error').textContent = ''
  render()
}

const params = new URLSearchParams(location.search)
if (params.get('trashed')) {
  const entry = params.get('trashed')
  toast('"' + (params.get('title') || '다이어그램') + '"을(를) 휴지통으로 옮겼어', '되돌리기', () => untrash(entry))
  history.replaceState(null, '', '/')
}
load()
let reloadTimer = null
const events = new EventSource('/events/_library')
events.addEventListener('hello', e => { if (JSON.parse(e.data).version !== VERSION) location.reload() })
events.addEventListener('library', () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(load, 150) })
</script>
</body>
