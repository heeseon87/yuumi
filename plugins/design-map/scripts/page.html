<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design map</title>
<style>
  :root { --bg: #ffffff; --panel: #f6f7f9; --line: #e2e5ea; --text: #1d2228; --dim: #6b7280; --accent: #6a45a8; --blue: #2563eb; --teal: #0d9488; --green: #30a657; --red: #a63830; --warn-bg: #fff4f2; --warn-line: #f3c7c2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr var(--side-w, 380px); grid-template-rows: auto auto 1fr; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 44%; }
  header .meta { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
  header .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  /* What Claude is doing now lives in the island over the map; this strip only keeps the text. */
  #activity { display: none !important; }
  #island { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 4; display: inline-flex; align-items: center; gap: 7px; max-width: min(560px, calc(100% - 40px)); height: 30px; padding: 0 14px 0 12px; border-radius: 999px; background: rgba(26, 23, 33, .9); color: #f3f1f7; font-size: 12px; box-shadow: 0 8px 26px rgba(30, 24, 50, .24); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); white-space: nowrap; overflow: hidden; }
  #island[hidden] { display: none; }
  #island.can-click { cursor: pointer; }
  #island i { width: 7px; height: 7px; border-radius: 50%; background: #8a8595; flex: none; }
  #island.on i { background: #4fd18b; }
  #island.busy i { background: #b892ff; animation: island-dot 1.6s ease-in-out infinite; }
  #island.off i { background: #e0a64a; }
  #island.reply i { background: #6aa8ff; }
  #island .what { overflow: hidden; text-overflow: ellipsis; }
  #island .what b { font-weight: 600; color: #fff; }
  #island .what .soft { color: #aaa4b6; }
  @keyframes island-dot { 0%, 100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { #island.busy i { animation: none; } }
  body.previewing #island { top: 54px; }
  #activity .now { color: var(--teal); font-weight: 600; }
  #activity .off { color: var(--red); font-weight: 600; }
  #activity .sep { margin: 0 8px; color: var(--line); }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .chip.on { color: var(--green); border-color: #b7e3c5; background: #f1fbf4; }
  .chip.busy { color: var(--accent); border-color: #d9cbf2; background: #f7f3fd; }
  .chip.off { color: var(--dim); }
  button { font: inherit; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.urgent { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .5; cursor: default; }
  #stage { position: relative; overflow: hidden; cursor: grab; background: #fbfbfc; user-select: none; -webkit-user-select: none; }
  #stage.dragging { cursor: grabbing; }
  #canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #canvas svg { display: block; overflow: visible; }
  #canvas g.node, #canvas .edge-hit, #canvas g.cluster > rect, #canvas g.edgeLabel { cursor: pointer; }
  #canvas .edge-hit { stroke: transparent; stroke-width: 14px; fill: none; pointer-events: stroke; }
  #canvas .edge-picked { stroke-width: 3.5px !important; filter: drop-shadow(0 0 3px rgba(106, 69, 168, .9)); }
  #canvas .node.picked rect, #canvas .node.picked path, #canvas .cluster.picked > rect { filter: drop-shadow(0 0 6px rgba(106, 69, 168, .9)); }
  #canvas .node.unseen > rect, #canvas .node.unseen > path { stroke: var(--blue) !important; stroke-dasharray: 5 3; }
  #canvas .node.trail { filter: drop-shadow(0 0 4px rgba(13, 148, 136, .45)); }
  #canvas .node.focus-read { animation: pulse-read 1.4s ease-in-out infinite; }
  #canvas .node.focus-edit { animation: pulse-edit 1s ease-in-out infinite; }
  @keyframes pulse-read { 0%, 100% { filter: drop-shadow(0 0 2px rgba(104, 196, 184, .35)); } 50% { filter: drop-shadow(0 0 13px rgba(104, 196, 184, .95)); } }
  @keyframes pulse-edit { 0%, 100% { filter: drop-shadow(0 0 2px rgba(236, 150, 128, .35)); } 50% { filter: drop-shadow(0 0 13px rgba(236, 150, 128, .95)); } }
  #canvas .node.breathing { animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { filter: drop-shadow(0 0 1px rgba(181, 162, 217, .2)); } 50% { filter: drop-shadow(0 0 9px rgba(181, 162, 217, .85)); } }
  /* An undecided box waits: a slow warm swell, unlike the purple breath of work in progress. */
  #canvas .asking { animation: asking 2.8s ease-in-out infinite; }
  @keyframes asking {
    0%, 70%, 100% { filter: drop-shadow(0 0 1px rgba(217, 154, 6, .25)); }
    35% { filter: drop-shadow(0 0 10px rgba(217, 154, 6, .9)); }
  }
  #canvas .asking.leaning-to { animation-duration: 4.4s; }
  @media (prefers-reduced-motion: reduce) {
    #canvas .asking { animation: none; filter: drop-shadow(0 0 5px rgba(217, 154, 6, .7)); }
  }
  #asks { position: absolute; inset: 0; pointer-events: none; }
  .ask { position: absolute; left: 0; top: 0; transform: translate(-72%, -55%); display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #fff; color: #a4700a; box-shadow: 0 2px 8px rgba(70, 60, 100, .16), 0 0 0 1px #f0dcb6; pointer-events: auto; cursor: pointer; white-space: nowrap; }
  .ask:hover { box-shadow: 0 2px 10px rgba(70, 60, 100, .22), 0 0 0 1px #d99a06; }
  .ask i { width: 6px; height: 6px; border-radius: 50%; background: #d99a06; display: inline-block; animation: ask-dot 2.8s ease-in-out infinite; }
  .ask.leaning i { background: var(--accent); }
  .ask.leaning { color: var(--accent); box-shadow: 0 2px 8px rgba(70, 60, 100, .16), 0 0 0 1px #dccff2; }
  @keyframes ask-dot { 0%, 70%, 100% { opacity: .35; } 35% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ask i { animation: none; opacity: 1; } }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  #firefly { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; opacity: 0; transition: opacity .7s; }
  #firefly.on { opacity: 1; }
  #firefly i { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 42% 40%, #fff 0, #a6e6db 38%, rgba(166, 230, 219, 0) 72%); box-shadow: 0 0 14px 5px rgba(120, 208, 194, .5); animation: bob 2.6s ease-in-out infinite; }
  #firefly.edit i { background: radial-gradient(circle at 42% 40%, #fff 0, #f8c6b6 38%, rgba(248, 198, 182, 0) 72%); box-shadow: 0 0 14px 5px rgba(240, 162, 140, .5); }
  @keyframes bob { 0%, 100% { transform: translate(0, 0) scale(1); } 30% { transform: translate(2px, -3px) scale(1.08); } 65% { transform: translate(-2px, 1px) scale(.94); } }
  .spark { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: radial-gradient(circle, rgba(140, 214, 202, .95), rgba(140, 214, 202, 0) 70%); animation: spark .9s ease-out forwards; }
  .spark.edit { background: radial-gradient(circle, rgba(244, 178, 158, .95), rgba(244, 178, 158, 0) 70%); }
  @keyframes spark { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(.25); } }
  #caption { position: absolute; left: 0; top: 0; transform: translateX(-50%); padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 16px rgba(70, 60, 100, .1), 0 0 0 1px rgba(104, 196, 184, .35); font-size: 12px; color: #3f6f69; white-space: nowrap; opacity: 0; transition: opacity .4s; }
  #caption.on { opacity: 1; }
  #caption.edit { color: #8a4f42; box-shadow: 0 4px 16px rgba(70, 60, 100, .1), 0 0 0 1px rgba(236, 150, 128, .4); }
  .bubble { position: absolute; left: 0; top: 0; max-width: 300px; transform: translate(-50%, calc(-100% - 12px)); padding: 9px 12px; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(70, 60, 100, .16), 0 0 0 1px rgba(181, 162, 217, .35); font-size: 13px; line-height: 1.45; color: var(--text); pointer-events: auto; cursor: pointer; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: translateX(-50%) rotate(45deg); box-shadow: 1px 1px 0 rgba(181, 162, 217, .35); }
  .bubble b { color: #7d6aa8; margin-right: 4px; }
  .bubble.out { opacity: 0; transition: opacity .5s; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(.7); } to { opacity: 1; transform: translate(-50%, calc(-100% - 12px)) scale(1); } }
  #notify.quiet { opacity: .55; }
  #canvas .node.lifted { filter: drop-shadow(0 10px 16px rgba(70, 60, 100, .28)); transition: filter .2s; }
  #canvas .node.connect-target { filter: drop-shadow(0 0 10px rgba(181, 162, 217, 1)); }
  /* Quick Look: the code behind a box, over the map, gone with the same key that brought it. */
  #peek { position: absolute; inset: 0; margin: auto; width: min(780px, calc(100% - 48px)); height: min(72%, 640px); display: flex; flex-direction: column; border-radius: 14px; background: rgba(255, 255, 255, .97); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); box-shadow: 0 24px 70px rgba(40, 36, 60, .32), 0 0 0 1px rgba(70, 60, 100, .12); z-index: 6; overflow: hidden; }
  #peek[hidden] { display: none; }
  #peek .bar { display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 14px; border-bottom: 1px solid var(--line); background: #f7f7f9; font-size: 12px; min-width: 0; }
  #peek .bar .name { font-size: 13px; font-weight: 600; white-space: nowrap; }
  #peek .bar .where { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  #peek .tabs { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  #peek .tabs[hidden] { display: none; }
  #peek .tabs button { border-radius: 999px; white-space: nowrap; }
  #peek .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #peek .code { flex: 1; overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 6px 0 10px; outline: none; user-select: text; -webkit-user-select: text; }
  #peek .ln { display: flex; white-space: pre; min-width: max-content; padding-right: 16px; }
  #peek .ln .no { flex: none; width: 54px; padding-right: 14px; text-align: right; color: #b1b5bd; user-select: none; -webkit-user-select: none; }
  #peek .ln.hit { background: #fff4d6; }
  #peek .ln.hit .no { color: #a4700a; font-weight: 600; }
  #peek .say { padding: 18px; color: var(--dim); font: 13px/1.5 system-ui, -apple-system, sans-serif; }
  #peek .tk-k { color: #8a3fb5; }
  #peek .tk-s { color: #2f7d4a; }
  #peek .tk-c { color: #8e95a0; font-style: italic; }
  #peek .tk-n { color: #b5532a; }
  #peek .tk-a { color: #a4700a; }
  /* A sheet drops from the top of the map, as a macOS sheet drops from its window's title. */
  #scope-sheet { position: absolute; left: 50%; top: 0; width: min(470px, calc(100% - 32px)); transform: translateX(-50%); padding: 14px 16px 12px; border-radius: 0 0 16px 16px; background: rgba(255, 255, 255, .97); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); box-shadow: 0 20px 50px rgba(40, 36, 60, .26), 0 0 0 1px rgba(70, 60, 100, .1); z-index: 7; animation: sheet-down .34s cubic-bezier(.2, 1.1, .4, 1); }
  #scope-sheet[hidden] { display: none; }
  @keyframes sheet-down { from { transform: translate(-50%, -100%); } to { transform: translate(-50%, 0); } }
  #scope-sheet .title { font-weight: 600; font-size: 14px; }
  #scope-sheet .sub { font-size: 12px; color: var(--dim); margin: 3px 0 10px; }
  #scope-sheet .choice { display: grid; grid-template-columns: 18px 1fr; gap: 1px 8px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
  #scope-sheet .choice:has(input:checked) { border-color: var(--accent); background: #faf7fe; }
  #scope-sheet .choice input { margin: 3px 0 0; grid-row: span 2; accent-color: var(--accent); }
  #scope-sheet .choice b { font-size: 13px; }
  #scope-sheet .choice span { font-size: 12px; color: var(--dim); }
  #scope-sheet .folders { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #scope-sheet .folders label { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px 1px 5px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
  #scope-sheet .folders label:has(input:checked) { border-color: #b5a2d9; background: #f4effc; }
  #scope-sheet .folders input { margin: 0; accent-color: var(--accent); }
  #scope-sheet .folders .n { color: var(--dim); font-size: 11px; }
  #scope-sheet .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .scope-line { font-size: 12px; color: var(--dim); margin-top: 10px; display: flex; gap: 6px; align-items: baseline; }
  .scope-line b { color: var(--text); font-weight: 600; }
  .scope-line .link { margin-left: auto; border: none; background: none; color: var(--accent); font-size: 12px; padding: 0 2px; }
  #lasso { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #lasso path { fill: rgba(106, 69, 168, .07); stroke: #8f73c4; stroke-width: 1.6; stroke-dasharray: 5 4; stroke-linejoin: round; stroke-linecap: round; transition: opacity .25s; }
  #lasso path.gone { opacity: 0; }
  .picklist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .picklist button { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px 1px 6px; }
  .picklist i { width: 9px; height: 9px; border-radius: 3px; border: 1px solid; display: inline-block; }
  #rubber { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; opacity: 0; transition: opacity .15s; }
  #rubber.on { opacity: 1; }
  #rubber path { fill: none; stroke: #b5a2d9; stroke-width: 2; stroke-dasharray: 6 5; stroke-linecap: round; animation: march .6s linear infinite; }
  #rubber circle { fill: #fff; stroke: #b5a2d9; stroke-width: 2; }
  @keyframes march { to { stroke-dashoffset: -11; } }
  .badge { position: absolute; left: 0; top: 0; transform: translate(-30%, -55%); padding: 1px 7px; border-radius: 999px; font-size: 11px; background: #fff; color: #5f9c86; box-shadow: 0 2px 8px rgba(70, 60, 100, .14), 0 0 0 1px #c9e7d6; pointer-events: auto; cursor: pointer; white-space: nowrap; }
  .badge.open { color: #7d6aa8; box-shadow: 0 2px 8px rgba(70, 60, 100, .14), 0 0 0 1px #dccff2; }
  #popover { position: absolute; left: 0; top: 0; width: 300px; transform: translate(-50%, 12px); padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .94); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 14px 40px rgba(70, 60, 100, .2), 0 0 0 1px rgba(181, 162, 217, .4); pointer-events: auto; animation: pop-in .3s cubic-bezier(.2, 1.3, .4, 1); }
  #popover[hidden] { display: none; }
  #decider { position: absolute; left: 0; top: 0; width: 400px; max-height: 70%; overflow: auto; padding: 8px; border-radius: 16px; background: rgba(255, 255, 255, .95); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 14px 40px rgba(70, 60, 100, .22), 0 0 0 1px rgba(181, 162, 217, .45); pointer-events: auto; animation: pop-in .3s cubic-bezier(.2, 1.3, .4, 1); }
  #decider[hidden] { display: none; }
  #decider.docked { width: min(560px, calc(100% - 28px)); }
  #leader { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #leader.on { opacity: 1; }
  #leader path { fill: none; stroke: #b5a2d9; stroke-width: 1.6; stroke-dasharray: 5 4; }
  #leader circle { fill: #b5a2d9; }
  #decider .card { margin-bottom: 0; border: none; box-shadow: none; background: none; padding: 4px 6px 2px; }
  #decider .shut { position: absolute; right: 10px; top: 9px; border: none; background: none; color: var(--dim); font-size: 13px; padding: 0 3px; line-height: 1; }
  #decider .card .q { padding-right: 22px; }
  /* Beside the diagram nothing may wrap into a paragraph: one line per option, and that is all. */
  .decision.compact .opt { align-items: center; gap: 8px; padding: 3px 0; }
  .decision.compact .opt .body { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .decision.compact .opt .body code { margin-right: 3px; }
  .decision.compact .blocked { padding: 4px 8px; }
  .decision.compact .blocked .what, .decision.compact .folded .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .decision.compact .more { display: flex; gap: 12px; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); }
  .decision.compact .more .link { border: none; background: none; color: var(--accent); font-size: 12px; padding: 0; }
  .elsewhere { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: baseline; margin-top: 8px; }
  .elsewhere .link { margin-left: auto; border: none; background: none; color: var(--accent); font-size: 12px; padding: 0 2px; }
  #popover .title { font-weight: 600; font-size: 13px; }
  #popover .sub { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  #popover textarea { width: 100%; min-height: 58px; resize: vertical; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #popover textarea:focus { outline: none; border-color: #b5a2d9; }
  #popover .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  #popover .row .spacer { flex: 1; }
  @keyframes pop-in { from { opacity: 0; transform: translate(-50%, 4px) scale(.94); } to { opacity: 1; transform: translate(-50%, 12px) scale(1); } }
  #impact { position: absolute; left: 0; top: 0; max-width: 280px; transform: translate(-50%, calc(-100% - 10px)); padding: 7px 11px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(70, 60, 100, .15), 0 0 0 1px rgba(181, 162, 217, .45); font-size: 12px; white-space: pre-wrap; opacity: 0; transition: opacity .2s; }
  #impact.on { opacity: 1; }
  #pins { position: absolute; inset: 0; pointer-events: none; }
  .waypin { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 5px; max-width: 190px; padding: 4px 9px; border: none; border-radius: 999px; background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3); box-shadow: 0 4px 14px rgba(70, 60, 100, .18), 0 0 0 1px rgba(181, 162, 217, .5); font-size: 11.5px; color: var(--accent); cursor: pointer; pointer-events: auto; white-space: nowrap; animation: waypin-in .18s ease-out; }
  .waypin:hover { background: #fff; }
  .waypin .what { overflow: hidden; text-overflow: ellipsis; }
  .waypin .way { font-size: 12px; flex: none; }
  @keyframes waypin-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .decision .q { cursor: zoom-in; }
  .decision .q .go { opacity: 0; color: var(--accent); font-size: 11px; flex: none; transition: opacity .15s; }
  .decision .q:hover .go { opacity: 1; }
  #canvas .hush, #canvas .dimmed { opacity: .22; transition: opacity .35s; }
  #canvas .ghosted { opacity: .62; filter: drop-shadow(0 0 9px rgba(181, 162, 217, .95)); transition: opacity .35s; }
  #canvas svg.filtering g.edgePaths, #canvas svg.filtering g.edgeLabels { opacity: .3; }
  #pills, #filecaps { position: absolute; inset: 0; transition: opacity .35s; }
  #pills.off, #filecaps.off { opacity: 0; }
  .pill { position: absolute; left: 0; top: 0; z-index: 1; transform: translate(-50%, -50%); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #3b3a40; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 3px 12px rgba(70, 60, 100, .12); transition: font-size .18s, padding .18s; }
  /* A name with no room left is a dot, as on a map: it says its name under the pointer. */
  .pill.faded { opacity: .28; transition: opacity .35s; }
  .pill.dot { z-index: 0; width: 11px; height: 11px; padding: 0; font-size: 0; background: var(--ink, #8e889e) !important; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(70, 60, 100, .28); pointer-events: auto; cursor: pointer; }

<script>
const NAME = '__NAME__'
const TOKEN = '__TOKEN__'
const VERSION = '__VERSION__'
const stage = document.getElementById('stage')
const canvas = document.getElementById('canvas')
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', suppressErrorRendering: true, class: { useMaxWidth: false } })

const TYPE_NAMES = {
  sequenceDiagram: '시퀀스', flowchart: '플로차트', graph: '플로차트', classDiagram: '클래스', stateDiagram: '상태',
  'stateDiagram-v2': '상태', erDiagram: 'ER', gantt: '간트', mindmap: '마인드맵', timeline: '타임라인', pie: '파이', journey: '여정', gitGraph: 'git',
}
const LOCAL = ['expand', 'collapse', 'hide', 'reset', 'decide', 'open', 'lean', 'reject', 'blocked', 'scope']
/** What the mod applies and then drops from the thread: folds, and the notes left while deciding. */
const VIEW_ONLY = ['expand', 'collapse', 'lean', 'reject', 'blocked', 'scope']
/** The revision shown instead of the current one, while looking back. */
let previewRev = null
let versions = []
let isAllVersions = false
/** A plain diagram's source editor: open, changed since the last save, and the revision it started from. */
let editing = false
let dirty = false
let editBase = null
const isMap = () => page !== null && page.kind === 'map'
/** What makes a Claude Code session the one that receives this map's feedback. */
const CONNECT = '/design-map ' + NAME

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text)
    return true
  } catch {}
  // Without clipboard access (an unfocused page), the older copy command still works.
  const area = document.createElement('textarea')
  area.value = text
  area.style.cssText = 'position:fixed;opacity:0'
  document.body.appendChild(area)
  area.select()
  const isCopied = document.execCommand('copy')
  area.remove()
  return isCopied
}
async function copyConnect() {
  toast(await copyText(CONNECT)
    ? '복사했어. Claude Code 세션에 붙여 넣고 실행하면 그 세션이 피드백을 받아'
    : '복사하지 못했어. 직접 입력해 줘: ' + CONNECT)
}
let view = { x: 20, y: 20, k: 1 }
let page = null
let thread = { items: [], isListening: false, isBusy: false, owner: null }
let activity = { sessions: [] }
let target = { kind: 'map' }
let isFirst = true
let renderCount = 0
let freshIds = new Set()

// ---------------------------------------------------------------- zoom and pan
function apply() {
  canvas.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')'
  $('zoom').textContent = Math.round(view.k * 100) + '%'
  layoutOverlay()
}
function size() {
  const svg = canvas.querySelector('svg')
  if (!svg) return { w: 1, h: 1 }
  const box = svg.viewBox.baseVal
  return { w: box.width || 1, h: box.height || 1 }
}
/** Room the floating bars take when shown: the status island on top, the time machine below. */
const FIT_BOTTOM = 56
function fit() {
  const { w, h } = size()
  const top = isMap() ? 54 : 20
  const k = Math.min((stage.clientWidth - 40) / w, (stage.clientHeight - top - FIT_BOTTOM) / h, 2)
  view = { k, x: (stage.clientWidth - w * k) / 2, y: top }
  apply()
}
function zoomAt(factor, cx, cy) {
  const k = Math.min(8, Math.max(0.05, view.k * factor))
  view.x = cx - (cx - view.x) * (k / view.k)
  view.y = cy - (cy - view.y) * (k / view.k)
  view.k = k
  apply()
}
/**
 * A notched mouse wheel, as opposed to a trackpad's two fingers. Both arrive as wheel events.
 * A wheel moves in whole steps (Chrome: 40px a notch, elsewhere 100 or 120, Firefox in lines);
 * a trackpad streams small, often fractional pixels, sideways too. A stream stays a trackpad
 * until it rests, so one whole-step event inside a swipe does not turn it into a zoom.
 */
let smoothUntil = 0
function isWheelNotch(e) {
  if (e.deltaMode !== 0) return true
  const now = performance.now()
  const y = Math.abs(e.deltaY)
  const isStep = e.deltaX === 0 && Number.isInteger(y) && y >= 40 && (y % 40 === 0 || y % 100 === 0 || y % 120 === 0)
  if (!isStep) { smoothUntil = now + 350; return false }
  return now > smoothUntil
}
// As in Maps and Freeform: two fingers move the map, a pinch (ctrlKey) or ⌘ zooms it. A mouse
// wheel has no second gesture to zoom with, so its notches keep zooming.
stage.addEventListener('wheel', e => {
  e.preventDefault()
  const r = stage.getBoundingClientRect()
  if (e.ctrlKey || e.metaKey || (!e.shiftKey && isWheelNotch(e))) {
    zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top)
  } else {
    view.x -= e.deltaX; view.y -= e.deltaY; apply()
  }
}, { passive: false })
let drag = null
/** Holding still on a box this long lifts it: pulling it then draws a line to another box. */
const LIFT_MS = 260
/** Holding still this long opens the box's own speech bubble. */
const HOLD_MS = 560
const canConnect = () => isMap() && !isSeq() && previewRev === null && !editing
function endDrag() {
  if (!drag) return
  for (const timer of drag.timers) clearTimeout(timer)
  if (drag.node) drag.node.classList.remove('lifted')
  canvas.querySelectorAll('.connect-target').forEach(n => n.classList.remove('connect-target'))
  $('rubber').classList.remove('on')
  drag = null
  stage.classList.remove('dragging')
}
const boxUnder = (x, y) => {
  const hit = document.elementFromPoint(x, y)
  const dot = hit && hit.closest && hit.closest('.pill[data-id]')
  if (dot && page && page.elements[dot.dataset.id] && nodeOf(dot.dataset.id)) return { id: dot.dataset.id, node: nodeOf(dot.dataset.id) }
  const node = hit && hit.closest && hit.closest('#canvas g.node')
  const id = node ? idOf(node) : null
  return id && page && page.elements[id] ? { id, node } : null
}
stage.addEventListener('pointerdown', e => {
  // The bars and popovers over the stage have their own controls: capturing the pointer would take their clicks.
  if (e.target.closest && e.target.closest('.no-pan')) return
  if (e.button !== 0) return
  closePopover()
  // ⇧ and drag: a loop drawn by hand, and every box inside it becomes the one thing talked about.
  if (e.shiftKey && canConnect()) {
    drag = { x: e.clientX, y: e.clientY, moved: false, mode: 'lasso', points: [[e.clientX, e.clientY]], timers: [] }
    $('lasso').querySelector('path').classList.remove('gone')
    stage.setPointerCapture(e.pointerId)
    return
  }
  const box = canConnect() ? boxUnder(e.clientX, e.clientY) : null
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, from: box && box.id, node: box && box.node, mode: box && e.altKey ? 'connect' : 'pan', timers: [] }
  if (box && drag.mode === 'pan') {
    drag.timers.push(setTimeout(() => { if (drag && !drag.moved) { drag.mode = 'lifted'; box.node.classList.add('lifted') } }, LIFT_MS))
    drag.timers.push(setTimeout(() => { if (drag && !drag.moved) { endDrag(); openBoxPopover(box.id) } }, HOLD_MS))
  }
  stage.setPointerCapture(e.pointerId)
})
stage.addEventListener('pointermove', e => {
  if (!drag) return
  if (drag.mode === 'lasso') {
    const [lx, ly] = drag.points[drag.points.length - 1]
    if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 3) drag.points.push([e.clientX, e.clientY])
    drag.moved = drag.points.length > 2
    drawLasso(drag.points)
    return
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y
  const isFar = Math.abs(dx) + Math.abs(dy) > 4
  if (drag.mode === 'lifted' && isFar) drag.mode = 'connect'
  if (drag.mode === 'connect') {
    if (isFar) { drag.moved = true; for (const timer of drag.timers) clearTimeout(timer) }
    drawRubber(drag.from, e.clientX, e.clientY)
    return
  }
  if (drag.mode === 'lifted') return
  if (isFar && !drag.moved) { drag.moved = true; stage.classList.add('dragging'); for (const timer of drag.timers) clearTimeout(timer) }
  if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply() }
})
stage.addEventListener('pointerup', e => {
  if (!drag) return
  const was = drag
  endDrag()
  if (was.mode === 'lasso') { lassoPick(was.points); return }
  if (was.mode === 'connect' && was.moved) {
    const to = boxUnder(e.clientX, e.clientY)
    if (to && to.id !== was.from) openConnectPopover(was.from, to.id)
    return
  }
  if (was.moved || !isMap() || previewRev !== null) return
  // Pointer capture keeps the browser from seeing a double click: a second click on the same box soon after is one.
  const box = was.from && boxUnder(e.clientX, e.clientY)
  const now = performance.now()
  if (box && lastClick && lastClick.id === box.id && now - lastClick.at < 380) {
    lastClick = null
    openBoxPopover(box.id)
    return
  }
  lastClick = box ? { id: box.id, at: now } : null
  // Pointer capture makes the stage the target; ask what is really under the pointer.
  pick(document.elementFromPoint(e.clientX, e.clientY) || stage)
})
stage.addEventListener('pointercancel', () => { endDrag(); $('lasso').querySelector('path').setAttribute('d', '') })
let lastClick = null
function drawLasso(points) {
  const s = stage.getBoundingClientRect()
  $('lasso').querySelector('path').setAttribute('d', points.map(([x, y], n) => (n === 0 ? 'M' : 'L') + (x - s.left) + ',' + (y - s.top)).join(' ') + ' Z')
}
/** The boxes whose centres the loop holds; the loop itself fades as they light up. */
function lassoPick(points) {
  const path = $('lasso').querySelector('path')
  path.classList.add('gone')
  setTimeout(() => { if (path.classList.contains('gone')) path.setAttribute('d', '') }, 300)
  if (points.length < 3) return
  const s = stage.getBoundingClientRect()
  const poly = points.map(([x, y]) => [x - s.left, y - s.top])
  const inside = (x, y) => {
    let isIn = false
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i]
      const [xj, yj] = poly[j]
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) isIn = !isIn
    }
    return isIn
  }
  const ids = []
  for (const node of canvas.querySelectorAll('g.node')) {
    const id = idOf(node)
    if (!id || !page.elements[id] || node.classList.contains('ghost')) continue
    const b = screenBox(node)
    if (inside(b.x + b.w / 2, b.y + b.h / 2)) ids.push(id)

// ---------------------------------------------------------------- since you last looked
const seenKey = 'design-map-seen-' + NAME

    elements[id] = designFact(el)
  }
  return {
    revision: p.revision,
    elements,
    relations: p.relations.map(r => r.from + '>' + r.to + ':' + (r.kind || '') + ':' + (r.label || '')),
    decisions: Object.fromEntries((p.decisions || []).map(d => [d.id, d.chosen || ''])),
  }
}
/**
 * Only a change in the design counts as news. Progress (steps, done, files) moves on every
 * implementation turn; counting it lit every box blue the moment the order was written down.
 */
function designFact(el) {
  const { working, number, steps, done, files, ...fact } = el
  if (fact.members) fact.members = fact.members.map(({ done, ...m }) => m)
  return JSON.stringify(fact)
}
function readSeen() {
  try {
    const seen = JSON.parse(localStorage.getItem(seenKey) || 'null')

  } catch { return null }
}

  renderUnseen()
}

  // everything drawn after would read as new. Start the baseline at the first real picture.
  if (!seen || Object.keys(seen.elements).length === 0) { markSeen(); return }
  const now = facts(page)
  const changed = Object.keys(now.elements).filter(id => seen.elements[id] !== undefined && seen.elements[id] !== now.elements[id])
  const added = Object.keys(now.elements).filter(id => seen.elements[id] === undefined)
  const removed = Object.keys(seen.elements).filter(id => now.elements[id] === undefined)
  const relAdded = now.relations.filter(r => !seen.relations.includes(r)).length
  const relRemoved = seen.relations.filter(r => !now.relations.includes(r)).length
  // What was decided and answered meanwhile, not only which boxes moved: that is what you missed.
  const before = seen.decisions
  const made = before === undefined ? [] : page.decisions.filter(d => d.chosen && (before[d.id] ?? '') !== d.chosen).map(d => d.id)
  const asked = before === undefined ? [] : page.decisions.filter(d => !d.chosen && before[d.id] === undefined).map(d => d.id)
  const isGap = seen.revision !== page.revision
  const answers = !isGap || seen.at === undefined ? [] : thread.items.filter(i => i.reply && (i.repliedAt || 0) > seen.at)
  if (changed.length + added.length + removed.length + relAdded + relRemoved + made.length + asked.length === 0) { $('unseen').innerHTML = ''; return }
  for (const id of [...changed, ...added]) {
    for (const node of nodesOf(id)) node.classList.add('unseen')
  }
  const parts = []
  const noun = isSeq() ? '항목' : '상자'
  if (made.length) parts.push('결정 확정 ' + made.length + ' <span class="dim">' + made.map(esc).join(' ') + '</span>')
  if (asked.length) parts.push('새 결정 ' + asked.length + ' <span class="dim">' + asked.map(esc).join(' ') + '</span>')
  if (answers.length) parts.push('답변 ' + answers.length)
  if (changed.length) parts.push('바뀐 ' + noun + ' ' + changed.length)
  if (added.length) parts.push('새 ' + noun + ' ' + added.length)
  if (removed.length) parts.push('지운 ' + noun + ' ' + removed.length + ' <span class="dim">' + removed.map(esc).join(', ') + '</span>')

    '<div class="digest">' + parts.map(p => '<span>' + p + '</span>').join('') + '</div>' +
    (changed.length + added.length ? '<div class="dim">' + (isSeq() ? '파랗게 빛나는 항목' : '파란 점선 상자') + '가 바뀐 곳이야.' + (canPlay ? ' M을 누르고 있으면 rev ' + seen.revision + ' 모습이 보여.' : '') + '</div>' : '') +
    '<div class="row">' + (canPlay ? '<button id="seen-play">▶ 그사이 바뀐 것만 다시 보기</button>' : '') + '<button id="seen-ok">확인했어</button></div>'

    const path = canvas.querySelector('path.relation[data-edge="' + index + '"]')
    if (path) { const b = screenBox(path); return { x: b.x + b.w / 2, y: b.y + b.h / 2 } }
  }

// ---------------------------------------------------------------- focus: a picked box and what it touches
/** Lines drawn between boxes, by index, with the boxes at each end. */
function edgesOfBox(id) {
  return (page.edges || []).map((e, index) => ({ ...e, index })).filter(e => e.from === id || e.to === id)
}
function applyFocus() {
  canvas.querySelectorAll('.unfocused').forEach(n => n.classList.remove('unfocused'))
  canvas.querySelectorAll('path.relation.flowing').forEach(n => n.classList.remove('flowing'))
  if (!isMap() || isSeq() || previewRev !== null) return
  if (target.kind === 'elements') {
    const held = new Set(target.ids)
    for (const node of canvas.querySelectorAll('g.node')) if (!held.has(idOf(node))) node.classList.add('unfocused')
    ;(page.edges || []).forEach((e, index) => {
      const path = canvas.querySelector('path.relation[data-edge="' + index + '"]')
      if (path) path.classList.add(held.has(e.from) && held.has(e.to) ? 'flowing' : 'unfocused')
    })
    return
  }
  if (target.kind !== 'element') return
  const id = target.id
  if (!nodeOf(id)) return
  const touching = edgesOfBox(id)
  const near = new Set([id, ...touching.flatMap(e => [e.from, e.to])])
  const lines = new Set(touching.map(e => e.index))
  for (const node of canvas.querySelectorAll('g.node')) if (!near.has(idOf(node))) node.classList.add('unfocused')
  for (const path of canvas.querySelectorAll('path.relation')) {
    if (lines.has(Number(path.dataset.edge))) path.classList.add('flowing')
    else path.classList.add('unfocused')
  }

// ---------------------------------------------------------------- flow playback: a pulse along the calls, in order

function flowOrder() {

  const starts = [...new Set(edges.map(e => e.from))].filter(id => !incoming.has(id))

  const seen = new Set()

  for (let i = 0; i < queue.length; i++) {
    for (const e of edges.filter(x => x.from === queue[i] && !seen.has(x.index))) {
      seen.add(e.index)
      order.push(e)
      if (!queue.includes(e.to)) queue.push(e.to)
    }
  }
  for (const e of edges) if (!seen.has(e.index)) order.push(e)

}
/** A glowing dot travelling along `line` (a path or a line) over `ms`. */

    const step = now => {
      const t = Math.min(1, (now - start) / ms)
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
      const p = line.getPointAtLength(total * e)
      dot.setAttribute('cx', p.x)
      dot.setAttribute('cy', p.y)

  } else {
    for (const e of flowOrder()) {

      if (path && !(target.kind === 'element' && (e.from === target.id || e.to === target.id))) path.classList.remove('flowing')

// ---------------------------------------------------------------- done: a stamp on the box, thunk
const SVG_NS = 'http://www.w3.org/2000/svg'
function svgEl(tag, attrs) {

  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v)

}

function stampDone(states, before) {
  canvas.querySelectorAll('.stamp').forEach(n => n.remove())
  if (!isMap() || isSeq() || !states) return
  for (const [id, state] of Object.entries(states)) {
    if (!state.isDone) continue
    const node = nodeOf(id)
    if (!node) continue
    const b = node.getBBox()
    const stamp = svgEl('g', { class: 'stamp', transform: 'translate(' + (b.x + b.width - 8) + ',' + (b.y + 9) + ')' })
    const face = svgEl('g', { class: 'stamp-face', transform: 'rotate(-14)' })
    face.append(svgEl('circle', { class: 'face', r: 13 }), svgEl('circle', { class: 'rim', r: 10.5 }))
    const text = svgEl('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central' })
    text.textContent = '완료'
    face.append(text)
    stamp.append(face)
    node.append(stamp)
    const wasDone = before && before[id] && before[id].isDone
    if (before && !wasDone && !REDUCED.matches) {
      face.animate([
        { transform: 'rotate(-34deg) scale(2.4)', opacity: 0 },
        { transform: 'rotate(-10deg) scale(.88)', opacity: 1, offset: 0.62 },
        { transform: 'rotate(-14deg) scale(1)', opacity: 1 },
      ], { duration: 560, easing: 'cubic-bezier(.3, 1.4, .5, 1)', id: 'dm-stamp' })
      const wave = svgEl('circle', { class: 'wave', r: 13 })
      stamp.prepend(wave)
      wave.animate([{ transform: 'scale(1)', opacity: 0.9 }, { transform: 'scale(2.6)', opacity: 0 }], { duration: 700, delay: 330, easing: 'ease-out', id: 'dm-stamp' }).finished.then(() => wave.remove(), () => wave.remove())
    }
  }
}

// ---------------------------------------------------------------- progress rings
const RINGS = [
  { key: 'steps', name: '스텝', color: '#b5a2d9', r: 13 },
  { key: 'boxes', name: '구현', color: '#93cfa9', r: 9 },
  { key: 'decisions', name: '결정', color: '#efb2a0', r: 5 },
]
function ringCounts() {
  const changed = Object.values(page.elements).filter(e => e.kind !== 'group' && (e.change || 'keep') !== 'keep')
  return {
    steps: { done: page.steps.filter(s => s.state === 'done').length, total: page.steps.length },
    boxes: { done: changed.filter(e => e.done).length, total: changed.length },
    decisions: { done: page.decisions.filter(d => d.chosen).length, total: page.decisions.length },
  }
}
function renderRings() {
  const host = $('rings')
  if (!isMap() || previewRev !== null) { host.hidden = true; return }
  const counts = ringCounts()
  const shown = RINGS.filter(r => counts[r.key].total > 0)
  host.hidden = shown.length === 0
  if (host.hidden) return
  if (!host.querySelector('svg')) {
    host.innerHTML = '<svg viewBox="-16 -16 32 32">' + RINGS.map(r => '<circle class="track" r="' + r.r + '"/><circle data-ring="' + r.key + '" r="' + r.r + '" stroke="' + r.color + '"/>').join('') + '</svg>'
    host.onclick = () => { showPane('progress'); $('map-sections').scrollIntoView({ behavior: 'smooth', block: 'start' }) }
  }
  for (const r of RINGS) {
    const { done, total } = counts[r.key]
    const length = 2 * Math.PI * r.r
    const ring = host.querySelector('circle[data-ring="' + r.key + '"]')
    const track = ring.previousElementSibling
    ring.style.display = track.style.display = total > 0 ? '' : 'none'
    ring.setAttribute('stroke-dasharray', String(length))
    ring.setAttribute('stroke-dashoffset', String(total > 0 ? length * (1 - done / total) : length))
  }
  host.title = shown.map(r => r.name + ' ' + counts[r.key].done + '/' + counts[r.key].total).join(' · ')

  const isComplete = shown.every(r => counts[r.key].done === counts[r.key].total)
  const key = 'design-map-rings-' + NAME
  let seen = null
  try { seen = localStorage.getItem(key) } catch {}
  const now = isComplete ? 'done' : 'open'
  if (seen !== now) try { localStorage.setItem(key, now) } catch {}
  if (isComplete && seen === 'open' && !REDUCED.matches) burst(host)
}
/** A small ring of sparks when every ring closes. */
function burst(host) {
  const colors = RINGS.map(r => r.color)
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2
    const dot = document.createElement('i')
    dot.className = 'burst'
    dot.style.background = colors[i % colors.length]
    dot.style.setProperty('--dx', Math.cos(a) * 26 + 'px')
    dot.style.setProperty('--dy', Math.sin(a) * 26 + 'px')
    host.appendChild(dot)
    dot.addEventListener('animationend', () => dot.remove())
  }

/**
 * Two readings of one decision. Beside the diagram it has to be glanceable: the question and
 * the choices, one line each, nothing that wraps. Everything to study — the impacts, the table,
 * what was already proposed, the trail — needs width and goes in the panel, which has both.
 */
function compactCard(d) {
  const asked = proposalsOf(d.id)
  const opts = (d.options || []).map(o => {
    const isLean = o.id === d.leaning
    return '<div class="opt' + (isLean ? ' leaning' : '') + '" data-option="' + esc(o.id) + '">' +
      '<button class="lean" data-lean="' + esc(o.id) + '" title="' + (isLean ? '기울어짐 풀기' : '이쪽으로 기울이기 (확정 아님)') + '">' + (isLean ? '◉' : '○') + '</button>' +
      '<div class="body" title="' + esc(o.text + (o.impact ? '\n영향: ' + o.impact : '')) + '"><code>' + esc(o.id) + '</code> ' + esc(o.text) + '</div>' +
      holdButton(d, o.id) + '</div>'
  }).join('')
  const folded = foldedGroupsOf(d.id)
  return '<div class="card decision compact" tabindex="-1" data-decision="' + esc(d.id) + '">' +
    '<div class="q"><span class="text">' + esc(d.id) + ' ' + esc(d.question) + '</span>' +
    (d.oneWay ? '<span class="oneway">되돌리기 어려움</span>' : '') + '</div>' +
    (d.blocked ? '<div class="blocked"><span class="what">⏳ ' + esc(d.blocked) + '</span></div>' : '') + troubleHtml(d.id) +
    (folded.length === 0 ? '' : '<div class="folded"><span class="what">🗂 ' + folded.map(g => esc(nameOf(g))).join(', ') + ' 안</span>' +
      '<button class="link" data-unfold="' + esc(folded.join(' ')) + '">펼치기</button></div>') +
    opts +
    '<div class="more"><button class="link" data-more="' + esc(d.id) + '">자세히' + (asked.length === 0 ? '' : ' · 제안 ' + asked.length) + '</button>' +
    '<button class="link" data-otherfull="' + esc(d.id) + '">다른 길 적기</button></div></div>'
}
function decisionCard(d) {
  const lean = d.leaning
  const opts = (d.options || []).map(o => {
    const isLean = o.id === lean
    const picked = o.id === d.chosen
    return '<div class="opt' + (isLean ? ' leaning' : '') + '" data-option="' + esc(o.id) + '">' +
      // The leaning marker leads, so the options read as a list one of them is already nearer to.
      (d.chosen ? '' : '<button class="lean" data-lean="' + esc(o.id) + '" title="' + (isLean ? '기울어짐 풀기' : '이쪽으로 기울이기 (확정 아님)') + '">' + (isLean ? '◉' : '○') + '</button>') +
      '<div class="body' + (picked ? ' chosen' : '') + '"><code>' + esc(o.id) + '</code> ' + esc(o.text) +
      (o.impact ? '<div class="dim">영향: ' + esc(o.impact) + '</div>' : '') +
      (o.rejected ? '<div class="rejected"><b>접은 이유</b> ' + esc(o.rejected) + '</div>' : '') +
      '</div>' +
      (d.chosen ? '' : holdButton(d, o.id)) +
      '</div>'
  }).join('')
  const head = '<div class="q" title="눌러서 이 결정이 걸린 곳을 지도에서 보기"><span class="text">' + esc(d.id) + ' ' + esc(d.question) + '</span>' +
    '<span class="go">⤢ 지도에서</span>' +
    (d.oneWay ? '<span class="oneway">되돌리기 어려움</span>' : '') +
    (d.chosen ? '<span class="chosen">확정</span><button class="fold-up" data-fold="' + esc(d.id) + '" title="한 줄로 접기">접기</button>' : '') + '</div>'
  const blocked = d.chosen ? '' :
    '<div class="blocked"><span class="what">' + (d.blocked ? '⏳ 이걸 알면 정할 수 있어: ' + esc(d.blocked) : '<span class="dim">무엇을 알면 정할 수 있어?</span>') +
    '</span><button class="link" data-blocked="' + esc(d.id) + '">' + (d.blocked ? '고치기' : '적기') + '</button></div>'
  const folded = foldedGroupsOf(d.id)
  const away = folded.length === 0 ? '' :
    '<div class="folded"><span class="what">🗂 ' + folded.map(g => esc(nameOf(g))).join(', ') + ' 안에 접혀 있어서 지도에 안 보여</span>' +
    '<button class="link" data-unfold="' + esc(folded.join(' ')) + '">펼치기</button></div>'
  // Two options and neither fits is a real answer, and it has nowhere to go but here.
  const asked = proposalsOf(d.id)
  const sent = asked.length === 0 ? '' : '<div class="asked">' + asked.map(i =>
    '<div class="one"><div class="head"><b>#' + i.id + '</b> 다른 길 제안' +
    '<span class="status ' + esc(i.status) + '">' + esc(statusOf(i)) + '</span></div>' +
    '<div class="text">' + esc(i.text) + '</div>' +
    (i.reply ? '<div class="reply">' + esc(i.reply) + '</div>' : '') + '</div>').join('') + '</div>'
  const other = d.chosen ? '' : sent + '<div class="other"><button class="link" data-other="' + esc(d.id) + '">' +
    (asked.length === 0 ? '둘 다 아니야 · 다른 길 적기' : '하나 더 적기') + '</button></div>'
  return '<div class="card decision" tabindex="-1" data-decision="' + esc(d.id) + '">' + head + troubleHtml(d.id) + away + blocked + compareTable(d) + opts + other +
    (d.rationale ? '<div class="why-chosen">고른 이유: ' + esc(d.rationale) + '</div>' : '') +
    '<div class="trail" data-trail="' + esc(d.id) + '"></div></div>'
}
/** A one-way door is held, not clicked: the friction matches what it costs to be wrong. */
function holdButton(d, optionId) {
  const attrs = ' data-decision="' + esc(d.id) + '" data-option="' + esc(optionId) + '"'
  if (!d.oneWay) return '<button' + attrs + '>이걸로 결정</button>'
  return '<button class="hold"' + attrs + ' data-hold="1" title="되돌리기 어려운 결정이야. 꾹 누르고 있어">' +
    '<span class="fill"></span><span class="label">꾹 눌러서 결정</span></button>'
}
/** The options on the decision's own axes: comparing them side by side beats reading them in turn. */
function compareTable(d) {
  const axes = d.axes || []
  const rows = (d.options || []).filter(o => (o.by || []).length === axes.length)
  if (axes.length === 0 || rows.length < 2) return ''
  return '<table class="cmp"><thead><tr><th></th>' + axes.map(a => '<th>' + esc(a) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(o => '<tr' + (o.id === d.leaning ? ' class="lean"' : '') + '><td class="who">' + esc(o.id) +
      (o.id === d.chosen ? ' ✓' : '') + '</td>' + (o.by || []).map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>'
}
/** The open decision the inspector draws beside the picked item, so the pane never doubles it. */
function inspectorDecisionId() {
  if (!page || !scopeOn() || target.kind === 'relation') return undefined
  const item = page.elements[target.id] || (page.messages || {})[target.id]
  const id = item && item.decision
  if (!id) return undefined
  const d = page.decisions.find(x => x.id === id)
  return d && !d.chosen ? id : undefined
}
/** Made decisions the person opened back into cards; the rest stay one line in the ledger. */
const unfolded = new Set()
function ledgerRow(d) {
  const o = (d.options || []).find(x => x.id === d.chosen)
  return '<div class="decision ledger" tabindex="-1" data-decision="' + esc(d.id) + '" title="눌러서 펼치기">' +
    '<span class="lid">' + esc(d.id) + '</span>' +
    '<span class="lbody"><span class="lq">' + esc(d.question) + '</span><span class="lchoice">' + esc(o ? o.text : d.chosen) + '</span></span>' +
    '<span class="lwhen" data-when="' + esc(d.id) + '"></span></div>'
}
function renderDecisions() {
  const open = page.decisions.filter(d => !d.chosen)
  setTabCount('decisions', open.length, open.length ? '열린 결정 ' + open.length : '')
  const shown = scopeOn() ? page.decisions.filter(d => elementsOfDecision(d.id).some(id => pickedIds().includes(id))) : page.decisions
  const list = shown.filter(d => decisionHome(d.id) === 'pane')
  const moved = shown.filter(d => decisionHome(d.id) !== 'pane')
  const empty = moved.length > 0 ? '' : '<div class="dim">' + (scopeOn() ? '이 ' + scopeNoun() + '에 붙은 결정이 없어.' : '없음') + '</div>'
  // What is still open gets the room; what is made is a line, unless opened by hand.
  const asking = list.filter(d => !d.chosen)
  const made = list.filter(d => d.chosen)
  $('decisions').innerHTML = (list.length === 0 ? empty : asking.map(decisionCard).join('') +
    (made.length === 0 ? '' : '<div class="ledger-head">확정 ' + made.length + '</div><div class="ledger-list">' +
      made.map(d => unfolded.has(d.id) ? decisionCard(d) : ledgerRow(d)).join('') + '</div>')) +
    moved.map(d => elsewhereLine(d.id, decisionHome(d.id))).join('')
  wireDecisions()
  renderTrails()
}
/** Opens a ledger line into its card, or folds the card back, keeping the keyboard on it. */
function unfoldDecision(id, isOpen) {
  if (isOpen) unfolded.add(id)
  else unfolded.delete(id)
  renderDecisions()
  const card = [...$('decisions').querySelectorAll('.decision')].find(c => c.dataset.decision === id)
  if (card) { rove(card); card.focus({ preventScroll: true }) }
}
function wireDecisions(root) {
  root = root || $('decisions')
  const cards = [...root.querySelectorAll('.decision')]
  cards.forEach((card, n) => {
    if (n === 0) card.tabIndex = 0
    if (card.classList.contains('ledger')) {
      card.onfocus = () => { rove(card); previewDecision(card.dataset.decision, null) }
      card.onblur = clearDecisionPreview
      card.onkeydown = onDecisionKey
      card.onmouseenter = () => previewDecision(card.dataset.decision, null)
      card.onmouseleave = clearDecisionPreview
      card.onclick = () => unfoldDecision(card.dataset.decision, true)
      return
    }
    card.onfocus = () => { rove(card); previewDecision(card.dataset.decision, null) }
    card.onblur = clearDecisionPreview
    card.onkeydown = onDecisionKey
    const head = card.querySelector('.q')
    head.onmouseenter = () => previewDecision(card.dataset.decision, null)
    head.onclick = () => showDecisionOnMap(card.dataset.decision)
    card.querySelectorAll('.opt').forEach(opt => {
      opt.onmouseenter = () => previewDecision(card.dataset.decision, opt.dataset.option)
    })
    card.onmouseleave = clearDecisionPreview
  })
  for (const b of root.querySelectorAll('button[data-option]:not([data-lean])')) {
    if (b.dataset.hold === '1') wireHold(b)
    else b.onclick = () => decide(b.dataset.decision, b.dataset.option)
  }
  for (const b of root.querySelectorAll('button[data-lean]')) {
    b.onclick = e => {
      e.stopPropagation()
      const card = b.closest('.decision')
      const was = (page.decisions.find(d => d.id === card.dataset.decision) || {}).leaning
      sendFeedback('lean', null, { target: { kind: 'decision', id: card.dataset.decision, option: was === b.dataset.lean ? '' : b.dataset.lean }, text: '' })
    }
  }
  for (const b of root.querySelectorAll('button[data-blocked]')) {
    b.onclick = () => askBlocked(b.dataset.blocked)
  }
  for (const b of root.querySelectorAll('button[data-other]')) {
    b.onclick = () => askOther(b.dataset.other)
  }
  // The compact card hands the long reading and the long writing to the panel, which has room.
  for (const b of root.querySelectorAll('button[data-more]')) {
    b.onclick = () => studyDecision(b.dataset.more)
  }
  for (const b of root.querySelectorAll('button[data-otherfull]')) {
    b.onclick = () => { studyDecision(b.dataset.otherfull); askOther(b.dataset.otherfull) }
  }
  for (const b of root.querySelectorAll('button[data-fold]')) {
    b.onclick = e => { e.stopPropagation(); unfoldDecision(b.dataset.fold, false) }
  }
  for (const b of root.querySelectorAll('button[data-find]')) {
    b.onclick = () => showDecisionOnMap(b.dataset.find)
  }
  for (const b of root.querySelectorAll('button[data-unfold]')) {
    b.onclick = () => {
      for (const id of b.dataset.unfold.split(' ')) sendFeedback('expand', null, { target: { kind: 'element', id }, text: '' })
    }
  }
}
// ---------------------------------------------------------------- a decision's own history
/**
 * Every revision is kept whole, so a decision's trail is already on disk: when it was asked,
 * when it was answered, when the answer changed. Walked lazily and cached, because each step
 * is one fetch and the snapshots never change.
 */
const snapshots = new Map()
let trailRuns = 0
async function decisionsAt(revision) {
  if (snapshots.has(revision)) return snapshots.get(revision)
  const res = await fetch('/api/' + NAME + '/history/' + revision, { cache: 'no-store' })
  if (!res.ok) return null
  const got = (await res.json()).decisions || []
  snapshots.set(revision, got)
  return got
}
const stepsOf = (before, after) => {
  if (!before && after) return '열림'
  if (before && !after) return '지웠음'
  if (!before || !after) return ''
  if (before.chosen !== after.chosen) return after.chosen ? after.chosen + '로 확정' : '확정 풀림'
  if (before.leaning !== after.leaning) return after.leaning ? after.leaning + '로 기울어짐' : '기울어짐 풀림'
  if (JSON.stringify(before.options || []) !== JSON.stringify(after.options || [])) return '선택지 손봄'
  if (before.rationale !== after.rationale) return '이유 갱신'
  if (before.blocked !== after.blocked) return after.blocked ? '대기 이유 적음' : '대기 풀림'
  if (before.question !== after.question) return '질문 고침'
  return ''
}
/** Fills every visible card's trail line, newest revision last. */
async function renderTrails(root) {
  const hosts = [...(root || document).querySelectorAll('[data-trail]')]
  const whens = [...(root || document).querySelectorAll('[data-when]')]
  if (hosts.length + whens.length === 0 || versions.length === 0) return
  const mine = ++trailRuns
  const revisions = [...versions].map(v => v.revision).sort((a, b) => a - b)
  const marks = new Map()
  let before = new Map()
  for (const revision of revisions) {
    const list = await decisionsAt(revision)
    if (mine !== trailRuns) return
    if (list === null) continue
    const now = new Map(list.map(d => [d.id, d]))
    for (const id of new Set([...before.keys(), ...now.keys()])) {
      const what = stepsOf(before.get(id), now.get(id))
      if (what === '') continue
      marks.set(id, [...(marks.get(id) || []), { revision, what }])
    }
    before = now
  }
  for (const host of hosts) {
    const steps = marks.get(host.dataset.trail) || []
    if (steps.length === 0) { host.textContent = ''; continue }
    const shown = steps.slice(-3)
    host.innerHTML = (steps.length > shown.length ? '… ' : '') +
      shown.map(m => '<button class="link" data-goto="' + m.revision + '">rev ' + m.revision + '</button> ' + esc(m.what)).join(' → ')
    host.querySelectorAll('button[data-goto]').forEach(b => { b.onclick = () => preview(Number(b.dataset.goto)) })
  }
  // A ledger line's date is the day it was made, read off the same trail.
  for (const host of whens) {
    const made = (marks.get(host.dataset.when) || []).filter(m => m.what.endsWith('로 확정')).pop()
    const v = made && versions.find(x => x.revision === made.revision)
    host.textContent = v ? dayOf(v.at) : ''
    host.title = made ? 'rev ' + made.revision + '에서 확정' : ''
  }
}
const dayOf = t => new Date(t).toDateString() === new Date().toDateString() ? '오늘' : (new Date(t).getMonth() + 1) + '/' + new Date(t).getDate()

/** The decision's card wherever it is on screen: the pane, or the inspector beside the box. */
function openCardOf(id) {
  return [...document.querySelectorAll('.decision')].find(c => c.dataset.decision === id)
}
/** Choosing, and then the one question worth asking while the answer is still cheap. */
async function decide(id, option) {
  const sent = await sendFeedback('decide', null, { target: { kind: 'decision', id, option }, text: '' })
  if (sent) askWhyNot(id, option)
}
function wireHold(button) {
  let timer = null
  const stop = () => { button.classList.remove('on'); if (timer) { clearTimeout(timer); timer = null } }
  const start = () => {
    if (timer) return
    button.classList.add('on')
    timer = setTimeout(() => { stop(); decide(button.dataset.decision, button.dataset.option) }, 900)
  }
  button.onpointerdown = e => { e.preventDefault(); start() }
  button.onpointerup = stop
  button.onpointerleave = stop
  button.onpointercancel = stop
  // The keyboard commits the same way: held, not tapped. A click alone must not get through.
  button.onclick = e => e.preventDefault()
  button.onkeydown = e => { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); start() } }
  button.onkeyup = e => { if (e.code === 'Enter' || e.code === 'Space') stop() }
}
/** Why the other paths lost, asked once, in the only moment it is cheap to answer. */
function askWhyNot(id, chosen) {
  const card = openCardOf(id)
  const d = page.decisions.find(x => x.id === id)
  if (!card || !d) return
  const others = (d.options || []).filter(o => o.id !== chosen && !o.rejected)
  if (others.length === 0) return
  const box = document.createElement('div')
  box.className = 'why'
  box.innerHTML = '<div class="ask">접은 길은 왜 아니야? 한 줄이면 돼. 나중에 이 질문이 다시 올라올 때 이 한 줄이 막아 줘.</div>' +
    others.map(o => '<input data-why="' + esc(o.id) + '" placeholder="' + esc(o.id + ' ' + o.text) + '는 왜 아닌지">').join('') +
    '<div class="row"><button class="primary" data-why-save>남기기</button><button data-why-skip>나중에</button></div>'
  card.appendChild(box)
  const inputs = [...box.querySelectorAll('input[data-why]')]
  inputs[0].focus()
  const save = () => {
    for (const input of inputs) {
      const text = input.value.trim()
      if (text !== '') sendFeedback('reject', null, { target: { kind: 'decision', id, option: input.dataset.why }, text })
    }
    box.remove()
  }
  box.querySelector('[data-why-save]').onclick = save
  box.querySelector('[data-why-skip]').onclick = () => box.remove()
  for (const input of inputs) input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save() } })
}
/** What has already been asked about this decision, newest last, with how far it has got. */
function proposalsOf(id) {
  return thread.items.filter(i => i.action === 'propose' && i.target && i.target.kind === 'decision' && i.target.id === id)
}
/**
 * Anything about this decision that did not go through. A press that silently fails is worse
 * than one that is refused out loud: it gets pressed again, and again.
 */
function troublesOf(id) {
  return thread.items.filter(i => i.status === 'failed' && i.target && i.target.kind === 'decision' && i.target.id === id)
}
// Once made, what failed on the way there is history: only a failed note after the choice still matters.
const troubleHtml = id => troublesOf(id).filter(i => !(page.decisions.find(d => d.id === id) || {}).chosen || i.action === 'reject').map(i =>
  '<div class="trouble"><span class="what">' + esc(ACTION_NAMES[i.action] || i.action) + ' 실패' +
  (i.reply ? ': ' + esc(i.reply) : '') + '</span></div>').join('')
/**
 * The third way. A decision is a menu, and sometimes the right answer is not on it: the options
 * are wrong, or the question is. Saying so has to be as easy as picking, or it gets skipped and
 * the decision just sits open.
 */
function askOther(id) {
  const card = openCardOf(id)
  if (card === undefined) return
  const where = card.querySelector('.other')
  where.innerHTML = '<div class="ask">어떤 길이야? 질문 자체가 틀렸다고 해도 돼.</div>' +
    '<textarea data-other-text placeholder="예: 둘 다 말고 운영 환경만 WIF로 가고 나머지는 그대로 두면 어때"></textarea>' +
    '<div class="row"><button class="primary" data-other-send>보내기</button><button data-other-cancel>취소</button></div>'
  const area = where.querySelector('textarea')
  area.focus()
  const go = where.querySelector('[data-other-send]')
  const send = async () => {
    const text = area.value.trim()
    if (text === '' || go.disabled) { area.focus(); return }
    // One press, one proposal: a quiet card after sending reads as a cancel, and gets sent again.
    go.disabled = true
    go.textContent = '보내는 중…'
    const isSent = await sendFeedback('propose', null, { target: { kind: 'decision', id }, text })
    if (isSent) refreshDecisionCards()
    else { go.disabled = false; go.textContent = '보내기' }
  }
  where.querySelector('[data-other-send]').onclick = send
  where.querySelector('[data-other-cancel]').onclick = () => renderPanes()
  area.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); void send() }
    if (e.key === 'Escape') { e.preventDefault(); renderPanes() }
  })
}
/** Moves a decision from the map card to the panel, where the full card fits. */
function studyDecision(id) {
  closeDecider(true)
  // With the box still picked the full card lands in the inspector, not the pane: go where it went.
  if (inspectorDecisionId() !== id) showPane('decisions')
  const card = openCardOf(id)
  if (card !== undefined) card.scrollIntoView({ behavior: REDUCED.matches ? 'auto' : 'smooth', block: 'center' })
}
/** What the decision is waiting on, in the user's own words. */
function askBlocked(id) {
  const card = openCardOf(id)
  const d = page.decisions.find(x => x.id === id)
  if (!card || !d) return
  const where = card.querySelector('.blocked')
  where.innerHTML = '<input class="what" data-blocked-text placeholder="이걸 알면 정할 수 있어" value="' + esc(d.blocked || '') + '">' +
    '<button class="link" data-blocked-save>저장</button>'
  const input = where.querySelector('input')
  input.focus()
  input.select()
  const save = () => sendFeedback('blocked', null, { target: { kind: 'decision', id }, text: input.value.trim() })
  where.querySelector('[data-blocked-save]').onclick = save
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save() }
    if (e.key === 'Escape') { e.preventDefault(); renderDecisions() }
  })
}
/** One card at a time is in the tab order, so arrow keys walk the list the way a list should. */
function rove(card) {
  for (const c of card.parentNode.querySelectorAll('.decision')) c.tabIndex = c === card ? 0 : -1
}
function onDecisionKey(e) {
  const cards = [...e.currentTarget.parentNode.querySelectorAll('.decision')]
  const at = cards.indexOf(e.currentTarget)
  if (at < 0) return

// ---------------------------------------------------------------- the diagram
/**
 * Draws a source on the stage; on an error the last drawing stays up. `isAnimated`: boxes glide
 * from where the last drawing had them (Magic Move) instead of the picture jumping.
 */
async function draw(source, isAnimated = false) {
  renderCount += 1
  const id = 'dm' + renderCount
  const old = canvas.querySelector('svg')
  const before = isAnimated && old && !REDUCED.matches ? layoutOf(old) : null
  try {
    const { svg } = await mermaid.render(id, source)
    canvas.innerHTML = svg
  } catch (error) {
    document.getElementById('d' + id)?.remove()
    return { error: String(error && error.message || error) }
  }
  // Mermaid sizes the SVG to 100% of its box, which floats here: pin it to its own size.
  const drawn = canvas.querySelector('svg')
  const box = drawn.viewBox.baseVal
  drawn.removeAttribute('style')
  drawn.setAttribute('width', box.width)
  drawn.setAttribute('height', box.height)
  // Lines are thin to hit: lay a wide transparent copy under each, both knowing their line.
  // Mermaid numbers lines in the order they are written, which is the order of page.edges.
  if (isMap()) canvas.querySelectorAll('path.relation').forEach(path => {
    const m = /_(\d+)$/.exec(path.id || '')
    if (!m) return
    const index = Number(m[1]) - 1
    path.dataset.edge = String(index)
    const hit = path.cloneNode(false)
    hit.removeAttribute('id')
    hit.removeAttribute('marker-end')
    hit.removeAttribute('marker-start')
    hit.removeAttribute('style')
    hit.setAttribute('class', 'edge-hit')
    hit.dataset.edge = String(index)
    path.parentNode.insertBefore(hit, path)
  })
  if (before) magicMove(before, drawn)
  return {}
}

// ---------------------------------------------------------------- motion: Magic Move and folding
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)')
const EASE = 'cubic-bezier(.2, .8, .2, 1)'
/** A drawn piece's key across drawings: Mermaid adds the render id in front and a counter behind. */
const keyOf = n => (n.id || '').replace(/^dm\d+-/, '').replace(/-\d+$/, '')
const elementIdOfKey = key => key.startsWith('classId-') ? key.slice('classId-'.length) : key
function translateOf(n) {
  const t = n.transform && n.transform.baseVal.consolidate()
  return t ? { x: t.matrix.e, y: t.matrix.f } : { x: 0, y: 0 }
}
/** A point of `n`'s own space in the SVG's user space, whatever groups sit between. */
function userPoint(svg, n, x, y) {
  const p = svg.createSVGPoint()
  p.x = x
  p.y = y
  return p.matrixTransform(svg.getScreenCTM().inverse().multiply(n.getScreenCTM()))
}
/** Where every box and group sits, in canvas pixels at scale 1 (user units less the viewBox origin). */
function layoutOf(svg) {
  const vb = svg.viewBox.baseVal
  const boxes = new Map()
  const groups = new Map()
  for (const n of svg.querySelectorAll('g.node')) {
    const key = keyOf(n)
    if (!key || n.classList.contains('ghost')) continue
    const at = userPoint(svg, n, 0, 0)
    const b = n.getBBox()
    boxes.set(key, { x: at.x - vb.x, y: at.y - vb.y, w: b.width, h: b.height, node: n })
  }
  for (const c of svg.querySelectorAll('g.cluster')) {
    const id = groupIdOf(c)
    const r = c.querySelector('rect')
    if (!id || !r) continue
    const b = r.getBBox()
    const at = userPoint(svg, r, b.x + b.width / 2, b.y + b.height / 2)
    groups.set('classId-' + id, { x: at.x - vb.x, y: at.y - vb.y, w: b.width, h: b.height, node: c })
  }
  return { vb, boxes, groups }
}
/** The keys of a box's enclosing groups, nearest first: where it folds into and blooms out of. */
function ancestorKeys(key) {
  const keys = []
  const elements = page && page.elements
  for (let at = elements && elements[elementIdOfKey(key)]; at && at.parent; at = elements[at.parent]) keys.push('classId-' + at.parent)
  return keys
}
function placeIn(layout, keys) {
  for (const key of keys) {
    const found = layout.boxes.get(key) || layout.groups.get(key)
    if (found) return found
  }
  return null
}
/**
 * Boxes that stayed glide from their old place; a group folding shrinks into its box and its
 * children fly in after it; unfolding, they bloom out of where the box was. Lines fade in last.
 */
function magicMove(before, svg) {
  const after = layoutOf(svg)
  const ox = after.vb.x
  const oy = after.vb.y
  let isMoved = false
  for (const [key, now] of after.boxes) {
    const t = translateOf(now.node)
    const at = (dx, dy, s) => 'translate(' + (t.x + dx) + 'px,' + (t.y + dy) + 'px) scale(' + s + ')'
    const was = before.boxes.get(key)
    if (was) {
      const dx = was.x - now.x
      const dy = was.y - now.y
      if (Math.abs(dx) + Math.abs(dy) < 1) continue
      now.node.animate([{ transform: at(dx, dy, 1) }, { transform: at(0, 0, 1) }], { duration: 560, easing: EASE, id: 'dm-move' })
      isMoved = true
      continue
    }
    const folded = before.groups.get(key)
    const from = folded || placeIn(before, ancestorKeys(key))
    if (from) {
      const s = folded ? Math.max(0.3, Math.min(3, from.w / Math.max(now.w, 1))) : 0.25
      now.node.animate([{ transform: at(from.x - now.x, from.y - now.y, s), opacity: folded ? 0.35 : 0 }, { transform: at(0, 0, 1), opacity: 1 }], { duration: 640, easing: EASE, id: 'dm-bloom' })
    } else {
      now.node.animate([{ transform: at(0, 0, 0.85), opacity: 0 }, { transform: at(0, 0, 1), opacity: 1 }], { duration: 420, easing: EASE, id: 'dm-appear' })
    }
    isMoved = true
  }
  for (const [key, was] of before.boxes) {
    if (after.boxes.has(key)) continue
    const opened = after.groups.get(key)
    const to = opened || placeIn(after, ancestorKeys(key))
    const ghost = was.node.cloneNode(true)
    ghost.removeAttribute('id')
    ghost.classList.remove('picked', 'flash', 'flash-reply', 'unseen', 'trail', 'focus-read', 'focus-edit')
    ghost.classList.add('ghost')
    const gx = was.x + ox
    const gy = was.y + oy
    ghost.setAttribute('transform', 'translate(' + gx + ',' + gy + ')')
    svg.appendChild(ghost)
    const end = to
      ? 'translate(' + (to.x + ox) + 'px,' + (to.y + oy) + 'px) scale(' + (opened ? Math.min(1.6, to.w / Math.max(was.w, 1)) : 0.2) + ')'
      : 'translate(' + gx + 'px,' + gy + 'px) scale(.9)'
    const leaving = ghost.animate([{ transform: 'translate(' + gx + 'px,' + gy + 'px) scale(1)', opacity: 1 }, { transform: end, opacity: 0 }], { duration: opened ? 380 : 560, easing: EASE, id: 'dm-leave', fill: 'forwards' })
    leaving.finished.then(() => ghost.remove(), () => ghost.remove())
    isMoved = true
  }
  if (!isMoved) return
  for (const [key, now] of after.groups) {
    if (!before.groups.has(key)) now.node.animate([{ opacity: 0 }, { opacity: 0, offset: 0.4 }, { opacity: 1 }], { duration: 640, easing: 'ease-out', id: 'dm-frame' })
  }
  for (const n of svg.querySelectorAll('g.edgePaths, g.edgeLabels')) {
    n.animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1 }], { duration: 760, easing: 'ease-out', id: 'dm-lines' })
  }
}

async function load() {
  if (previewRev !== null) return
  const res = await fetch('/api/' + NAME, { cache: 'no-store' })
  if (res.status === 404) return gone()
  if (!res.ok) { $('error').textContent = '읽지 못했어: ' + await res.text(); return }
  const next = await res.json()
  if (previewRev !== null) return
  const before = page
  if (before === null || before.revision !== next.revision) { futures.clear(); futureShown = null; futureWanted = null }
  // A new revision may have answered the floating decision, and re-offers one that was put away.
  if (before === null || before.revision !== next.revision) deciderShut.clear()
  if (deciderOn !== null && (next.decisions.find(d => d.id === deciderOn) || {}).chosen !== undefined) closeDecider(false)
  page = next
  document.body.dataset.kind = page.kind
  $('gone').hidden = true
  header()
  drawerInfo()
  if (isMap()) side()
  let source = page.mermaid
  if (editing) {
    if (!dirty) {
      $('editor-text').value = page.mermaid
      editBase = page.revision
    } else if (page.revision !== editBase) {
      editorStatus('그사이 다른 곳에서 rev ' + page.revision + '이(가) 저장됐어. 저장할 때 어느 쪽을 남길지 고를 수 있어.', 'bad')
    }
    source = $('editor-text').value
  }
  const result = await draw(source, !isFirst && !editing)
  if (result.error) {
    if (editing) editorStatus('그리기 실패: ' + result.error.split('\n').slice(0, 3).join('\n'), 'bad')
    else $('error').textContent = '그리기 실패: ' + result.error
  } else {
    $('error').textContent = ''
  }
  if (isFirst) { fit(); isFirst = false } else apply()
  if (isMap() && !result.error) {
    if (isSeq() && !editing) decorateSequence()
    // Boxes whose drawing changed since the last version glow once.
    if (before && before.kind === 'map') {
      for (const [id, sig] of Object.entries(page.boxes || {})) {
        if ((before.boxes || {})[id] === sig) continue
        for (const node of nodesOf(id)) node.classList.add('flash')
      }
    }
    if (target.kind === 'element' && !page.elements[target.id]) target = { kind: 'map' }
    if (target.kind === 'elements') {
      const ids = target.ids.filter(id => page.elements[id])
      target = ids.length > 1 ? { kind: 'elements', ids } : ids.length === 1 ? { kind: 'element', id: ids[0] } : { kind: 'map' }
    }
    if (target.kind === 'message' && !(page.messages && page.messages[target.id]) && !(page.fragments && page.fragments[target.id])) target = { kind: 'map' }
    if (target.kind === 'relation' && !page.edges.some(e => e.from === target.from && e.to === target.to)) target = { kind: 'map' }
    setTarget(target)
    renderUnseen()
    renderActivity()
    breathe()
    applyFilter()
    stampDone(page.states, before && before.kind === 'map' ? before.states || {} : null)
    offerScope()
  }
  settleOverlay()
  loadVersions()
}

function gone() {

  canvas.innerHTML = ''
  $('gone').hidden = false

/** A memo as HTML: escaped first, then a few marks (headings, lists, code, bold, links to http(s) only). */
function markdown(text) {
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
  let html = ''
  let isList = false
  let isCode = false
  for (const line of esc(text).split('\n')) {
    if (line.trim().startsWith('```')) {
      if (isList) { html += '</ul>'; isList = false }
      html += isCode ? '</pre>' : '<pre>'
      isCode = !isCode
      continue
    }
    if (isCode) { html += line + '\n'; continue }
    const item = /^\s*[-*] (.*)$/.exec(line)
    if (item) {
      if (!isList) { html += '<ul>'; isList = true }
      html += '<li>' + inline(item[1]) + '</li>'
      continue
    }
    if (isList) { html += '</ul>'; isList = false }
    const heading = /^(#{1,3}) (.*)$/.exec(line)
    if (heading) html += '<h' + (heading[1].length + 2) + '>' + inline(heading[2]) + '</h' + (heading[1].length + 2) + '>'
    else if (line.trim() !== '') html += '<p>' + inline(line) + '</p>'
  }
  if (isList) html += '</ul>'
  if (isCode) html += '</pre>'
  return html
}

/** The card flies to the box it is about, so the pane and the map read as one surface. */
function flyCard(card, t) {
  if (REDUCED.matches || !card || t.kind === 'relation') return
  const node = nodesOf(t.id)[0] || clusterOf(t.id)
  if (!node) return
  const from = card.getBoundingClientRect()
  const to = node.getBoundingClientRect()
  if (from.width === 0 || to.width === 0 || to.height === 0) return
  const ghost = document.createElement('div')
  ghost.className = 'card-ghost'
  ghost.style.cssText = 'position:fixed;left:' + from.left + 'px;top:' + from.top + 'px;width:' + from.width + 'px;height:' + from.height + 'px'
  document.body.appendChild(ghost)
  const dx = to.left + to.width / 2 - (from.left + from.width / 2)
  const dy = to.top + to.height / 2 - (from.top + from.height / 2)
  const sx = Math.max(0.06, to.width / from.width)
  const sy = Math.max(0.06, to.height / from.height)
  const run = ghost.animate([
    { transform: 'none', opacity: 0.95 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')', opacity: 0 },
  ], { duration: 420, easing: EASE, fill: 'forwards' })
  run.onfinish = () => ghost.remove()
  run.oncancel = () => ghost.remove()
}

const params = new URLSearchParams(location.search)
const wantsEdit = params.get('edit') === '1'
if (params.has('edit')) history.replaceState(null, '', location.pathname)
load().then(() => {
  if (!page) return
  if (isMap()) { loadThread(); loadActivity() }
  if (wantsEdit) startEdit()
})
loadTagList()
const events = new EventSource('/events/' + NAME)
events.addEventListener('hello', e => {
  // A newer server came up: take its page too, unless that would lose an unsaved edit.
  if (JSON.parse(e.data).version !== VERSION && !(editing && dirty)) location.reload()
})
events.addEventListener('update', () => load())
events.addEventListener('feedback', () => { if (isMap()) loadThread() })
events.addEventListener('activity', () => { if (isMap()) loadActivity() })
</script>
</body>
</html>
